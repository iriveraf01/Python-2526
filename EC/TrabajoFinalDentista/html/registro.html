<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>

                    "surface-container-low": "#f2f4f6",
                    "on-secondary-fixed": "#002204",
                    "inverse-surface": "#2d3133",
                    "surface": "#f7f9fb",
                    "on-primary-container": "#002c4f",
                    "error-container": "#ffdad6",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "sm": "12px",
                    "md": "24px",
                    "xs": "4px",
                    "xl": "80px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom input glow derived from primary color for focus state */
        .input-glow:focus {
            box-shadow: 0 0 12px rgba(0, 97, 164, 0.15);
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-md font-body-md text-on-surface antialiased">
<!-- 
      Navigation Shell Suppressed:
      As per the "Semantic Shell Mandate", transactional/linear screens like Sign-up 
      must suppress the TopAppBar, SideNav, and Footer to prioritize the focused journey canvas.
    -->
<main class="w-full max-w-[480px]">
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(33,150,243,0.08)] p-lg flex flex-col gap-md border border-surface-container-highest">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-xs">
<div class="flex items-center justify-center w-12 h-12 bg-primary-fixed rounded-full mb-2 text-primary">
<span class="material-symbols-outlined text-[28px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dentistry</span>
</div>
<h1 class="font-h3 text-h3 text-on-surface">Dentify</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Crea tu cuenta para recibir atención profesional.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-md mt-2">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="name">Nombre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">person</span>
<input class="w-full bg-surface-container border-none rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary input-glow" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">mail</span>
<input class="w-full bg-surface-container border-none rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary input-glow" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">lock</span>
<input class="w-full bg-surface-container border-none rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary input-glow" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="confirm_password">Confirmar Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none text-[20px]">lock_reset</span>
<input class="w-full bg-surface-container border-none rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary input-glow" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm font-semibold rounded-lg py-3 mt-2 shadow-[0px_4px_12px_rgba(33,150,243,0.2)] hover:bg-on-primary-fixed-variant transition-colors duration-200 flex items-center justify-center gap-2" type="button">
                    Crear Cuenta
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Ya tienes una cuenta? 
                    <a class="text-primary font-medium hover:text-on-primary-fixed-variant hover:underline transition-colors duration-200" href="#">Inicia sesión</a>
</p>
</div>
</div>
</main>
</body></html>
