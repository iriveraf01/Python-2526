<body class="min-h-screen bg-background flex items-center justify-center p-md font-body-md text-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="w-full max-w-[440px]">
<div class="mb-lg text-center">
<div class="inline-flex items-center justify-center w-[56px] h-[56px] rounded-xl bg-primary-fixed mb-md">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="dentistry" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dentistry</span>
</div>
<h1 class="font-h2 text-h2 text-on-surface mb-xs tracking-tight">Bienvenido a Dentify</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Por favor, inicia sesión para gestionar tus citas.</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(33,150,243,0.08)] p-[32px] flex flex-col gap-md">
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-[14px] pl-[44px] pr-sm border-transparent focus:border-transparent focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg py-[14px] pl-[44px] pr-sm border-transparent focus:border-transparent focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-body-lg text-body-lg rounded-lg py-[14px] shadow-[0px_4px_12px_rgba(33,150,243,0.2)] transition-all duration-200 mt-base flex items-center justify-center gap-xs" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes una cuenta? 
                <a class="text-primary font-medium hover:text-primary-container hover:underline transition-all duration-200" href="#">Regístrate</a>
</p>
